# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build for https://<user>.github.io/SanzoFit/
        run: npm run build:pages

      # GitHub Pages has no SPA fallback: serve the app for unknown paths (deep links)
      # so the Angular router can handle them.
      - name: Add 404 fallback
        run: cp dist/sanzo-fit/browser/index.html dist/sanzo-fit/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sanzo-fit/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
