<div class="heading">
  <h2>Wardrobe</h2>
  <a class="add" routerLink="/wardrobe/new">+ Add</a>
</div>

@switch (state()) {
  @case ('loading') {
    <p class="muted">Loading…</p>
  }
  @case ('error') {
    <p class="error" role="alert">Could not load your wardrobe from your browser's storage.</p>
  }
  @default {
    <ul class="items">
      @for (item of items(); track item.id) {
        <li>
          <app-wardrobe-item-tile [item]="item" [colors]="colorsOf(item)" />
        </li>
      } @empty {
        <li class="muted">No items yet. Use “Add” to create your first one.</li>
      }
    </ul>
  }
}
