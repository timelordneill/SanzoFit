<section class="home">
  <h2>Colors</h2>

  <ul class="color-grid">
    @for (color of colors(); track color.name) {
      <li>
        <a class="color" [routerLink]="['/color', $index]">
          <div class="swatch" [style.background-color]="rgb(color)"></div>
          <div class="info">
            <span class="name">{{ color.name }}</span>
            <span class="values">
              <span class="cmyk">{{ cmyk(color) }}</span>
              <span class="rgb">{{ rgbValues(color) }}</span>
            </span>
          </div>
        </a>
      </li>
    } @empty {
      <li class="loading">Loading colors…</li>
    }
  </ul>
</section>
