<section class="home">
  <h2>Colors</h2>

  <ul class="color-grid">
    @for (color of colors(); track color.id) {
      <li>
        <a
          appColorTile
          class="color"
          size="lg"
          [color]="color"
          [routerLink]="['/color', color.id]"
        ></a>
      </li>
    } @empty {
      <li class="loading">Loading colors…</li>
    }
  </ul>
</section>
