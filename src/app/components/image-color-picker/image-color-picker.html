<p class="hint">Click the photo where the color is to find the closest matching colors.</p>

<div class="stage">
  <img class="photo" [src]="src()" alt="Item photo: click to pick a color" (click)="pick($event)" />
  @if (marker(); as marker) {
    <span
      class="marker"
      aria-hidden="true"
      [style.left.%]="marker.x"
      [style.top.%]="marker.y"
      [style.background-color]="sampledCss()"
    ></span>
  }
</div>

@if (error(); as error) {
  <p class="error" role="alert">{{ error }}</p>
}

@if (sampledCss(); as sampledCss) {
  <div class="result" aria-live="polite">
    <div
      appColorTile
      class="sample"
      name="Picked from photo"
      [swatch]="sampledCss"
      [values]="[sampledLabel()]"
    ></div>

    <ul class="matches" aria-label="Closest colors">
      @for (match of matches(); track match.color.hex) {
        <li>
          <button
            appColorTile
            type="button"
            class="match"
            [color]="match.color"
            [values]="match.lines"
            [class.added]="isSelected(match.color)"
            [disabled]="isSelected(match.color)"
            (click)="choose(match.color)"
          >
            <span class="action">{{ isSelected(match.color) ? 'Added' : '+ Add' }}</span>
          </button>
        </li>
      }
    </ul>
  </div>
}
